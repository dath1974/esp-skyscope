# Skyscope on a Waveshare ESP32-S3-Touch-AMOLED-2.41, ESP32-S3-Touch-LCD-2.8B or ESP32-P4-WIFI6-Touch-LCD-4C (the
# board, below). Flash it once over USB (esphome run skyscope.yaml, or the prebuilt firmware with ESPHome Web); after
# that it updates over Wi-Fi, from a build of your own (esphome run) or from the project's releases, which its web page
# offers when a new one is out.
#
# First start: the screen opens a Wi-Fi network named after it ("Skyscope ...") and shows how to join it. Join it with
# a phone, choose your own network on the page that opens, and the screen joins that network. Then open the address it
# shows in a browser and set the place to watch. Everything after that is set on that page.
substitutions:
  name: skyscope
  friendly_name: Skyscope
  # The firmware's version: a release sets it to its tag (without the v), and the screen offers a release whose
  # version differs from its own.
  version: "0.10.2"
  # Where the releases are published (GitHub Pages, by .github/workflows/release.yml). A build that should never be
  # offered them: remove the update: block and the skyscope: block's update_id.
  releases: https://dath1974.github.io/esp-skyscope
  # The board, one of boards/*.yaml: waveshare-amoled-241 (ESP32-S3, 2.41-inch AMOLED), waveshare-lcd-28b
  # (ESP32-S3, 2.8-inch LCD) or waveshare-p4-lcd-4c (ESP32-P4, round 4-inch LCD). Build another with
  # `esphome -s board <name> ...` or `make firmware BOARD=<name>`.
  board: waveshare-amoled-241
  # The followed plane's route from adsbdb (follow.h): off in published firmware, as adsbdb's route data may not be
  # copied without its owner's leave. `make firmware ROUTES=true` builds it in for a screen of your own.
  routes: "false"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Each screen gets its own name (skyscope-1a2b3c), so two on one network do not clash.
  name_add_mac_suffix: true
  # A build of each board of its own, so building one does not throw away the other's.
  build_path: build/skyscope-${board}
  project:
    name: dath1974.esp-skyscope
    version: ${version}

external_components:
  - source:
      type: local
      path: components

packages:
  board: !include boards/${board}.yaml

logger:
  level: INFO

# No network is written in here: the screen is told one over its own Wi-Fi network (captive portal) or over USB
# (Improv, from ESPHome Web), and keeps it.
wifi:
  ap:
    ssid: "Skyscope Setup"
    # With a network that cannot be reached, the setup network opens again after this long.
    ap_timeout: 1min

captive_portal:

improv_serial:

ota:
  - platform: esphome
    id: ota_esphome
  # Firmware downloaded by the screen itself, into the half of the flash it is not running from.
  - platform: http_request
    id: ota_web

http_request:
  useragent: esp-skyscope/${version}
  timeout: 15s

# The newest release, asked for every few hours; the web page shows it and installs it on a press, never by itself.
# Each board has its own manifest (tools/release_site.py), so a screen is only ever offered its own board's firmware.
update:
  - platform: http_request
    id: firmware
    name: Firmware
    source: ${releases}/${board}/manifest.json
    update_interval: 6h

# The time of day, for bedtime. The time zone is a setting on the screen's web page; UTC0 here only builds the time
# zone support in (and keeps the build machine's own zone out of the firmware).
time:
  - platform: sntp
    id: sntp_clock
    timezone: UTC0

skyscope:
  setup_network: "Skyscope Setup"
  time_id: sntp_clock
  update_id: firmware
