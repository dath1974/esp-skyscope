# Waveshare ESP32-P4-WIFI6-Touch-LCD-4C: a round 4-inch 720 x 720 IPS panel (JD9365 over two-lane MIPI-DSI) with
# GT9271 capacitive touch (read as a GT911), an ESP32-P4 (production v3 silicon) with 32 MB of flash and 32 MB of
# PSRAM, and an ESP32-C6 beside it for Wi-Fi (ESP-Hosted over SDIO). The pins are those of Waveshare's own board support
# package (esp32_p4_wifi6_touch_lcd_xc, shared with the 3.4-inch 3.4C) and of the ESP-Hosted link every Waveshare P4
# board uses.
#
# The board's hardware and sizes only; what the screen does is components/skyscope.

substitutions:
  # 720 pixels across a 4-inch circle.
  DISPLAY_DPI: "180"
  # Map tiles at their own pixels: at 180 dpi a tile's words read well at 1:1.
  TILE_SCALE: "1"
  FONT_SMALL_PX: "16"
  FONT_LABEL_PX: "20"
  FONT_TITLE_PX: "26"
  FONT_SPLASH_PX: "40"

esp32:
  variant: esp32p4
  # The chip has 32 MB, but ESPHome updates over the air past 16 MB only with ESP-IDF's experimental features: 16 MB
  # holds two firmwares with room to spare.
  flash_size: 16MB
  # Production silicon is rated for 400 MHz, and ESP-IDF offers nothing else for it: asked for 360 MHz, it ran at 400
  # all the same. ESPHome warns that 400 MHz is experimental on the P4 (early chips may not boot at it), but a v3.2
  # board runs it through every test.
  cpu_frequency: 400MHz
  # Production silicon (v3.x), as the 4C ships and Waveshare's own examples assume. A board with an early chip (its boot
  # log says "chip revision: v1.x") would need engineering_sample: true and a build of its own: firmware for one does
  # not start on the other.
  framework:
    type: esp-idf
    version: recommended
    advanced:
      assertion_level: SILENT
      # Built for speed, not size: there is room for it (two firmwares of 7.75 MB each), and the map's planes are
      # drawn faster.
      compiler_optimization: PERF
      loop_task_stack_size: 16384
    # The program runs from PSRAM, not flash, so writing the flash (an update, a saved setting) need not turn off the
    # cache that the flash and the PSRAM share: with it off, the panel's frame could not be read from the PSRAM and
    # the glass flashed through the whole of an update.
    # The cache reads the PSRAM 128 bytes at a time, not 64: the map is drawn from long rows of pixels there, and a
    # frame of planes over it takes up to a fifth less time. A cache of 256 KB (not 128) took up to a quarter off
    # again, but its 128 KB more come out of the internal RAM that the radio and the card need too.
    sdkconfig_options:
      CONFIG_SPIRAM_XIP_FROM_PSRAM: y
      CONFIG_CACHE_L2_CACHE_LINE_128B: y

psram:
  mode: hex
  speed: 200MHz

# The MIPI-DSI PHY's supply, from the P4's own regulator.
esp_ldo:
  - voltage: 2.5V
    channel: 3

# Wi-Fi comes from the ESP32-C6 on the board, which runs Espressif's ESP-Hosted firmware.
esp32_hosted:
  variant: ESP32C6
  active_high: true
  reset_pin: GPIO54
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

# The C6's own firmware travels in this one: ESP-Hosted as ESPHome builds it (esphome/esp-hosted-firmware), the version
# this ESPHome's host side is (ESPHome pins espressif/esp_hosted; `make firmware` checks the two agree). A C6 running
# any other is updated over the same SDIO link at start (the skyscope: block's coprocessor_update_id), whatever the
# board came with, as long as it runs some ESP-Hosted to take the update. One that does not:
# boards/esp-hosted/README.md.
update:
  - platform: esp32_hosted
    id: coprocessor
    name: Wi-Fi chip firmware
    type: embedded
    path: boards/esp-hosted/network_adapter_esp32c6-2.12.13.bin
    sha256: 09e4ed4ff648444ad045c1d934825af407648f58898586ce9f4275e53fdb23f6

i2c:
  id: touch_bus
  sda: GPIO7
  scl: GPIO8
  scan: false

# The backlight's PWM, inverted on this board (Waveshare's own driver sets output_invert).
output:
  - platform: ledc
    id: backlight
    pin: GPIO26
    inverted: true
    frequency: 5kHz

# The GT9271 answers as a GT911 does. Its reset and interrupt lines are not wired to the P4: it is read every 20 ms.
touchscreen:
  - platform: gt911
    id: touch
    i2c_id: touch_bus
    update_interval: 20ms
    display: panel

display:
  - platform: mipi_dsi
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-4C
    id: panel
    reset_pin: GPIO27
    update_interval: never
    auto_clear_enabled: false

lvgl:
  displays: [panel]
  touchscreens:
    - touchscreen_id: touch
  # All of the screen, in PSRAM, as on the other board: there is plenty of it here.
  buffer_size: 100%
  log_level: WARN
  default_font: font_label
  # One empty page: the screen builds what it shows in C++ (components/skyscope).
  pages:
    - id: main_page
      bg_color: 0x000000

font:
  - {file: "gfonts://Roboto Condensed@500", id: font_small, size: "${FONT_SMALL_PX}", glyphsets: [GF_Latin_Kernel], bpp: 4}
  - {file: "gfonts://Roboto Condensed@500", id: font_label, size: "${FONT_LABEL_PX}", glyphsets: [GF_Latin_Kernel], bpp: 4}
  - {file: "gfonts://Roboto@500", id: font_title, size: "${FONT_TITLE_PX}", glyphsets: [GF_Latin_Kernel], bpp: 4}
  # The screen's name on the splash at the start: its own letters only, large.
  - {file: "gfonts://Roboto@700", id: font_splash, size: "${FONT_SPLASH_PX}", glyphs: "SKYCOPE", bpp: 4}

# The speaker port (a 2-pin MX1.25 beside the USB-A port): an ES8311 codec on the touch bus, fed over I2S, and an
# NS4150B amplifier that GPIO53 turns on, as Waveshare's board support has them. The codec runs at 48 kHz, 16-bit mono,
# and a mixer feeds it from three sources: the screen's own sounds (components/skyscope/sound.h), and Home Assistant's
# announcements and media, each resampled to 48 kHz.
audio_dac:
  - platform: es8311
    id: codec
    i2c_id: touch_bus
    address: 0x18
    sample_rate: 48000
    bits_per_sample: 16bit
    use_mclk: true

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

switch:
  - platform: gpio
    id: amplifier
    pin: GPIO53
    restore_mode: ALWAYS_ON
    internal: true

speaker:
  - platform: i2s_audio
    id: codec_out
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO9
    audio_dac: codec
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono
  - platform: mixer
    id: speaker_mixer
    output_speaker: codec_out
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      # The screen's own: its buffer holds half a second, as a slow pass of the loop may come between two pieces.
      - id: sounds
        buffer_duration: 500ms
      - id: announcements_in
      - id: media_in
  - platform: resampler
    id: announcements
    output_speaker: announcements_in
    task_stack_in_psram: true
  - platform: resampler
    id: media
    output_speaker: media_in
    task_stack_in_psram: true

# The speaker in Home Assistant: its announcements (text to speech) and whatever it plays. Its volume is the screen's
# own: volume_min and volume_max are sound.h's CODEC_LOW and CODEC_HIGH, so a percentage is as loud from either side.
media_player:
  - platform: speaker
    id: player
    name: Speaker
    volume_min: 0.5
    volume_max: 0.8
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: announcements
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media
      format: FLAC
      num_channels: 1
      sample_rate: 48000

skyscope:
  dpi: ${DISPLAY_DPI}
  tile_scale: ${TILE_SCALE}
  font_small: font_small
  font_label: font_label
  font_title: font_title
  font_splash: font_splash
  brightness_output: backlight
  # The GT9271 tracks several fingers: pinch to zoom, two fingers to pan.
  touchscreen_id: touch
  # The glass is a circle: what the screen shows stays inside it.
  round: true
  coprocessor_update_id: coprocessor
  # An RTL-SDR stick (the FlightAware Pro Stick Plus, or any with an R820T or R820T2 tuner) on the board's USB-A port:
  # "Radio" among the sources. The Pro Stick Plus has its own filter and amplifier; a lower gain suits a stick that is
  # swamped by planes close by.
  radio:
    gain: 49.6
  # The TF slot, for the map card: slot 0 of the SD/MMC host (its own pins, GPIO 39 to 44, four data lines), powered
  # by the P4's LDO channel 4, as Waveshare's board support does it. Slot 1 of the same host is the Wi-Fi chip's.
  # The speaker's sounds (an alert's chime, a click), and the media player whose volume is the screen's.
  speaker: sounds
  media_player: player
  card:
    slot: 0
    width: 4
    power_ldo: 4
    frequency: 40MHz
